name: preview smoke
# Optional integration: requires Vercel's GitHub deployment events and repository
# secrets. The current demo uses manually verified CLI deployments; this workflow
# is not an enforced promotion gate. See docs/deploy.md before enabling it.
on:
  deployment_status:
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/smoke.ts
        env:
          DEMO_URL: ${{ github.event.deployment_status.target_url }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-smoke
          path: artifacts/deployment-smoke.json
